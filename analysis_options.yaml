analyzer:
  exclude:
    # Generated code — intl message catalogues (strict_top_level_inference
    # noise, ~60 infos) and flutter_gen asset bindings. Not hand-maintained,
    # so linting it is pure noise that drowns out real findings.
    - lib/generated/**
    - lib/gen/**
  errors:
    deprecated_member_use: ignore
    invalid_annotation_target: ignore
    dead_code: warning
    invalid_assignment: error
    unused_import: warning
    unnecessary_null_comparison: warning
    # Advisory during the offline-first migration. Scaffolding is deliberately
    # written a step ahead of the widget/outbox wiring that will use it (e.g.
    # the table-badge pause/resume handler onto TableTimerLocalRepository, the
    # category-edit dialog params). Keeping these visible-but-non-blocking
    # means CI never forces a half-built feature to be deleted to go green.
    # Revert to `warning` once the migration's scaffolding is fully wired.
    unused_element: info
    unused_element_parameter: info
include: package:flutter_lints/flutter.yaml

linter:
 rules:
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

