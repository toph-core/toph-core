name: Analyze

on:
  push:
    branches: [main, test, 'claude/**']
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Import-boundary check
        run: bash scripts/check_import_boundary.sh

      - name: Flutter analyze
        run: flutter analyze

      # Runs the whole suite, including test/architecture_guard_test.dart — the
      # ratchet that enforces the §9 guardrails (no networking outside the
      # transport layer, no repository injection in presentation/pages, no
      # FutureBuilder). Those rules were only ever checked by a test that never
      # ran in CI; this step is what gives them teeth on every push and PR.
      - name: Flutter test
        run: flutter test
