name: Analyze

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Import-boundary check
        run: bash scripts/check_import_boundary.sh

      - name: Flutter analyze
        run: flutter analyze
