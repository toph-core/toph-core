name: Build Windows

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Extract version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $ver = $raw.Split('+')[0]
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Create installer with Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            windows\installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MaryAIPOS-Installer-${{ steps.version.outputs.version }}
          path: build\windows\installer\*.exe
          retention-days: 30

      - name: Upload raw build
        uses: actions/upload-artifact@v4
        with:
          name: MaryAIPOS-RawBuild-${{ steps.version.outputs.version }}
          path: build\windows\x64\runner\Release\
          retention-days: 7
