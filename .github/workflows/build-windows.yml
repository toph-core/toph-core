name: Build Windows

on:
  push:
    branches: [main, test]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    # windows-latest uses VS 18 / MSVC 14.51, which hard-errors experimental
    # coroutines (STL1011) in permission_handler_windows and
    # flutter_local_notifications_windows. Mitigated in windows/CMakeLists.txt
    # via _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS — do not patch
    # ephemeral .plugin_symlinks (regenerated every build).
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $ver = $raw.Split('+')[0]
          $build = if ($raw -match '\+(.+)$') { $matches[1] } else { '1' }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "build=$build" >> $env:GITHUB_OUTPUT
          echo "full=$ver+$build" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver+$build"

      - name: Build Windows Release
        run: flutter build windows --release --verbose --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.build }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build/windows/**/*.log
            build/windows/**/CMakeCache.txt
            build/windows/**/CMakeFiles/CMakeError.log
            build/windows/**/CMakeFiles/CMakeOutput.log
          retention-days: 7
          if-no-files-found: warn

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup not found at $iscc"
            exit 1
          }
          Write-Host "Inno Setup found: $iscc"

      - name: Create installer with Inno Setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/Qp" `
            windows\installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem build\windows\installer\*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File "$($_.FullName).sha256" -Encoding ASCII -NoNewline
            Write-Host "SHA256: $($hash.Hash)  $($_.Name)"
          }

      - name: List installer output
        shell: pwsh
        run: |
          Get-ChildItem build\windows\installer\ | Format-Table Name, Length, LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaryAIPOS-Installer-v${{ steps.version.outputs.version }}
          path: |
            build\windows\installer\*.exe
            build\windows\installer\*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Upload raw build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaryAIPOS-RawBuild-v${{ steps.version.outputs.version }}
          path: build\windows\x64\runner\Release\
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Mary AI POS v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            build/windows/installer/*.exe
            build/windows/installer/*.sha256

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          ## Mary AI POS Windows Build

          - **Version**: ${{ steps.version.outputs.full }}
          - **Status**: ${{ job.status }}
          - **Trigger**: ${{ github.event_name }}
          - **Branch/Tag**: ${{ github.ref_name }}

          ### Artifacts
          - Installer: ``MaryAIPOS-Installer-v${{ steps.version.outputs.version }}``
          - Raw build: ``MaryAIPOS-RawBuild-v${{ steps.version.outputs.version }}``
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
