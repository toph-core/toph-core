<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"></link>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></link>
</helmet>

<div style="font-family:'DM Sans',sans-serif; min-height:100vh; background:#2A2A32; display:flex; align-items:center; justify-content:center; padding:40px; box-sizing:border-box;">
  <div style="width:440px; background:#FFFFFF; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.35); padding:24px; box-sizing:border-box;">

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:17px; color:#111827; white-space:nowrap;">Faol davrlar</div>
      <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#9CA3AF; cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12.5px; color:#9CA3AF;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
      Ochildi: {{ openedAtLabel }}
    </div>

    <div style="height:1px; background:#F0F1F3; margin:16px 0;"></div>

    <sc-for list="{{ sessions }}" as="s" hint-placeholder-count="2">
      <div style="margin-bottom:18px;">
        <div style="display:flex; align-items:flex-start; gap:10px;">
          <div style="width:26px; height:26px; border-radius:8px; background:#FFF1E6; color:#EA580C; display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; flex-shrink:0;">{{ s.index }}</div>
          <div style="flex:1; min-width:0;">
            <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; color:#111827;">{{ s.tableLabel }}</div>
            <div style="font-size:12px; color:#9CA3AF; margin-top:1px;">{{ s.priceLabel }}</div>
          </div>
          <div style="text-align:right; flex-shrink:0; white-space:nowrap;">
            <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:#374151; white-space:nowrap;">{{ s.durationLabel }}</div>
            <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:13.5px; color:#EA580C; margin-top:2px; white-space:nowrap;">{{ s.costLabel }}</div>
          </div>
        </div>

        <div style="margin-left:36px; margin-top:8px; position:relative;">
          <div style="position:absolute; left:5px; top:2px; bottom:10px; width:1px; background:#EEF0F2;"></div>
          <sc-for list="{{ s.segments }}" as="seg" hint-placeholder-count="2">
            <div style="display:flex; align-items:center; gap:10px; padding:6px 0 6px 16px; position:relative;">
              <span style="position:absolute; left:1px; top:50%; transform:translateY(-50%); width:7px; height:7px; border-radius:50%; background:{{ seg.dotColor }};"></span>
              <div style="font-size:12px; color:#6B7280; flex:1; white-space:nowrap;">{{ seg.rangeLabel }}</div>
              <div style="text-align:right; flex-shrink:0; white-space:nowrap;">
                <div style="font-size:11.5px; color:#9CA3AF;">{{ seg.durationLabel }}</div>
                <div style="font-size:12px; font-weight:600; color:#B45309; margin-top:1px;">{{ seg.costLabel }}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="height:1px; background:#F0F1F3; margin:14px 0 14px;"></div>

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; color:#111827; white-space:nowrap;">Jami: {{ totalDurationLabel }}</div>
      <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; color:#EA580C; white-space:nowrap;">{{ totalCostLabel }}</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
function fmtMoney(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm";
}
function fmtDur(mins) {
  const h = Math.floor(mins / 60), m = Math.round(mins % 60);
  return `${h}:${String(m).padStart(2, '0')}`;
}

// Each session = a table occupancy (new one per transfer). Each session has
// segments = (resume -> pause) working pairs; first segment starts at creation.
const SESSIONS_RAW = [
  {
    table: 'Stol 3', pricePerHour: 80000,
    segments: [
      { from: '19:08', to: '19:38', minutes: 30 },
      { from: '19:43', to: '19:57', minutes: 14 },
    ],
  },
  {
    table: 'Stol 15', pricePerHour: 80000,
    segments: [
      { from: '19:45', to: '19:52', minutes: 7 },
    ],
  },
];

class Component extends DCLogic {
  renderVals() {
    let grandMinutes = 0, grandCost = 0;
    const sessions = SESSIONS_RAW.map((s, i) => {
      const segments = s.segments.map((seg, j) => {
        const cost = seg.minutes / 60 * s.pricePerHour;
        return {
          rangeLabel: `${seg.from} → ${seg.to}`,
          durationLabel: fmtDur(seg.minutes),
          costLabel: fmtMoney(cost),
          dotColor: j === s.segments.length - 1 ? '#EA580C' : '#FCD9B8',
        };
      });
      const minutes = s.segments.reduce((a, seg) => a + seg.minutes, 0);
      const cost = minutes / 60 * s.pricePerHour;
      grandMinutes += minutes;
      grandCost += cost;
      return {
        index: i + 1,
        tableLabel: s.table,
        priceLabel: `${fmtMoney(s.pricePerHour)}/soat`,
        durationLabel: fmtDur(minutes),
        costLabel: fmtMoney(cost),
        segments,
      };
    });

    return {
      openedAtLabel: SESSIONS_RAW[0].segments[0].from,
      sessions,
      totalDurationLabel: fmtDur(grandMinutes),
      totalCostLabel: fmtMoney(grandCost),
    };
  }
}
</script>
</body>
</html>
